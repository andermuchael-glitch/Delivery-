name: Build Entrega365 APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.svg"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install

      - name: Preparar versão mobile
        run: npm run mobile:prepare

      - name: Verificar preparação mobile
        run: test -d www && echo "www OK - build remoto habilitado"

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar Firebase Google nativo
        run: |
          test -f android/app/google-services.json || { echo "::error::Falta android/app/google-services.json. Registre br.com.entrega365.app no Firebase e adicione o arquivo."; exit 1; }
          printf '\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = \'1.3.0\'\n}\n' >> android/variables.gradle

      - name: Gerar SHA-1 DEBUG para Firebase
        working-directory: android
        run: ./gradlew signingReport

      - name: Gerar ícones Entrega365
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#ffd21a" --iconBackgroundColorDark "#121212" --splashBackgroundColor "#121212" --splashBackgroundColorDark "#121212"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Entrega365-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
