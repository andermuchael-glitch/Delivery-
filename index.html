<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-moto.svg">
<title>Delivery Comandas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#050b14;--panel:#0b1420;--panel2:#0e1a28;--line:#1b2a3b;--text:#f5f8fc;--muted:#91a0b4;--blue:#087cff;--blue2:#0057d9;--cyan:#38a7ff;--green:#19d67b;--yellow:#ffc21a;--red:#ff4b55}
body{margin:0;background:radial-gradient(circle at 20% -10%,#0c2c50 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
#app{min-height:100vh;padding-bottom:78px}
header{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(5,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:9px}.logo{width:46px;height:46px;border-radius:13px;background:#07111e url("logo-moto.svg") center/cover no-repeat;border:1px solid #164a80}.brand{font-weight:900;letter-spacing:.3px}.sub{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:5px}.ico,.navbtn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:11px;width:38px;height:38px}
main{max-width:650px;margin:auto;padding:14px 12px}
.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(5,11,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab b{font-size:20px}.tab.active{color:#4da8ff}
.card{background:linear-gradient(145deg,#0d1926,#09121d);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 30px #0004}
.hero{display:flex;justify-content:space-between;align-items:center;padding:15px;border-radius:18px;background:linear-gradient(135deg,#0b1c30,#07101b);border:1px solid #1a3550;margin-bottom:13px}.hero h2{margin:0 0 4px;font-size:18px}.hero p{margin:0;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border:1px solid var(--line);border-radius:15px;background:#0a141f}.stat .v{font-size:20px;font-weight:900;margin-top:6px}.stat .l{font-size:11px;color:var(--muted)}.blue{color:#48a7ff}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;padding:13px;margin-top:10px;box-shadow:0 7px 22px #006cff44}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.title{font-weight:900;font-size:17px;margin:3px 0 12px}.muted{color:var(--muted)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.daycenter{text-align:center}.daycenter strong{display:block}.daycenter input{color:var(--muted);background:transparent;border:0;font-size:11px}
.tablehead,.entry{display:grid;grid-template-columns:1fr 1fr 38px 34px;gap:6px;align-items:center}.tablehead{color:var(--muted);font-size:10px;text-transform:uppercase;padding:0 2px 7px;border-bottom:1px solid var(--line)}.entry{padding:6px 0}
input,select{width:100%;background:#08121e;border:1px solid #223448;color:#fff;border-radius:10px;padding:10px 9px;outline:none}input:focus,select:focus{border-color:var(--blue)}
.check{width:22px;height:22px;accent-color:var(--blue)}.trash{border:0;background:transparent;color:#ff6870;font-size:17px}.add{width:100%;padding:11px;border:1px dashed #285075;background:#081522;color:#49a8ff;border-radius:11px;font-weight:800}
.line{height:1px;background:var(--line);margin:13px 0}.sum{display:flex;justify-content:space-between;padding:5px 0;color:#b9c4d2}.sum.total{border-top:1px solid #3a4655;margin-top:5px;padding-top:11px;font-size:16px;font-weight:900;color:#fff}
.kmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kmresult{margin-top:9px;padding:13px;border:1px solid #155ba0;background:#06172a;border-radius:13px;display:flex;justify-content:space-between;align-items:center}.kmresult b{font-size:22px;color:#42a6ff}
.notice{padding:10px 12px;border-radius:11px;background:#0b1b2b;color:#aebdcd;font-size:12px;border:1px solid var(--line)}.notice.warn{border-color:#745b16;background:#211b08;color:#ffd65c}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 10%,#0b3157,transparent 38%),var(--bg)}.loginbox{width:100%;max-width:390px;text-align:center}.biglogo{width:190px;height:105px;margin:0 auto 10px;background:url("logo-moto.svg") center/contain no-repeat}.loginbox h1{margin:0;font-size:25px}.loginbox p{color:var(--muted);margin:5px 0 18px}.loginbox .card{text-align:left;padding:18px}.loginbox label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}.loginbox .primary{margin-top:14px}
.mechhero{display:flex;gap:12px;align-items:center}.mechicon{font-size:30px}.oilbox{border:1px solid #164d7f;background:#071a2b;border-radius:14px;padding:13px;margin-top:12px}.oilbox h3{margin:0 0 10px}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #17283a}.kv:last-child{border:0}.bigblue{font-size:24px;font-weight:900;color:#49a8ff}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:900;font-size:11px}.ok{background:#073a25;color:#42ef9c}.att{background:#3a2d05;color:#ffd43d}.over{background:#40131a;color:#ff6e77}
.monthnav{display:flex;justify-content:space-between;align-items:center}.monthnav strong{text-transform:capitalize}.dayitem{display:grid;grid-template-columns:1.2fr .9fr .9fr;gap:5px;padding:11px 0;border-bottom:1px solid var(--line)}.dayitem:last-child{border:0}.right{text-align:right}
.empty{text-align:center;color:var(--muted);padding:25px 5px}.small{font-size:11px;color:var(--muted)}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.actions .ico:nth-child(1){display:none}.grid{gap:7px}.stat{padding:11px}.stat .v{font-size:18px}.entry{grid-template-columns:1fr 1fr 34px 28px;gap:4px}.tablehead{grid-template-columns:1fr 1fr 34px 28px}.kmgrid{grid-template-columns:1fr 1fr}}

.radio-card{margin-top:12px}.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.radio{border:1px solid var(--line);background:#081522;border-radius:14px;padding:12px}.radio strong{display:block}.radio span{display:block;color:var(--muted);font-size:11px;margin:3px 0 10px}.radio a{display:block;text-align:center;text-decoration:none;border-radius:10px;background:#0b6fe0;color:#fff;padding:10px;font-weight:900;font-size:12px}.radio a:active{transform:scale(.98)}
@media(max-width:390px){.radio-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const K="dcv2:",$=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0"), today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dateLabel=k=>{let [y,m,d]=k.split("-").map(Number),dt=new Date(y,m-1,d);return dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",weekday:"short"})};
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(K+user+":"+k))??f}catch{return f}};
const save=(k,v)=>localStorage.setItem(K+user+":"+k,JSON.stringify(v));
let user=localStorage.getItem(K+"session"), view="day", day=today(), expDay=today(), month=new Date(), loginMode="login";
const defDay=k=>({date:k,entries:[],arrancada:0,kmInicial:"",kmFinal:""});
const defExp=k=>({date:k,items:[]});
const defMech=()=>({ultimaTroca:"",intervalo:"",motoKm:""});
const getDay=k=>load("day:"+k,defDay(k)), getExp=k=>load("exp:"+k,defExp(k)), getMech=()=>load("mechanica",defMech());
function users(){return load("users",{})} function setUsers(v){save("users",v)}
function login(u,p){let us=users();return us[u]&&us[u].p===btoa(unescape(encodeURIComponent(p)))}
function showLogin(){document.body.innerHTML=`<div id="app"><div class="login"><div class="loginbox"><div class="biglogo"></div><h1>Delivery Comandas</h1><p>${loginMode==="login"?"Controle suas entregas de forma simples":"Crie seu usuário neste aparelho"}</p><div class="card"><label>Usuário</label><input id="u" autocomplete="username"><label>Senha</label><input id="p" type="password" autocomplete="${loginMode==="login"?"current-password":"new-password"}"><button class="primary" id="go">${loginMode==="login"?"ENTRAR":"CRIAR CONTA"}</button><button class="add" id="switch" style="margin-top:9px">${loginMode==="login"?"Criar novo usuário":"Já tenho uma conta"}</button></div><div class="small">Dados locais por usuário neste dispositivo.</div></div></div></div>`;
$("#go").onclick=()=>{let u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!u||!p)return alert("Preencha usuário e senha.");let us=users();if(loginMode==="register"){if(us[u])return alert("Usuário já existe.");us[u]={p:btoa(unescape(encodeURIComponent(p)))};setUsers(us)}else if(!login(u,p))return alert("Usuário ou senha inválidos.");user=u;localStorage.setItem(K+"session",u);location.reload()};$("#switch").onclick=()=>{loginMode=loginMode==="login"?"register":"login";showLogin()}}
function totals(d){let taxas=d.entries.reduce((s,e)=>s+(+e.taxa||0),0);let km=(+d.kmFinal||0)-(+d.kmInicial||0);return{taxas,ent:d.entries.length,conf:d.entries.filter(e=>e.ok).length,arr:+d.arrancada||0,total:taxas+(+d.arrancada||0),km:km>0?km:0}}
function saveDayAnd(k,d){save("day:"+k,d)}
function shell(content){document.body.innerHTML=`<div id="app"><header><div class="head"><div class="logo"></div><div><div class="brand">Delivery Comandas</div><div class="sub">${esc(user)}</div></div></div><div class="actions"><button class="ico" onclick="backup()">⬇</button><button class="ico" onclick="logout()">⏻</button></div></header><main>${content}</main><nav class="tabs">${tab("day","📋","Dia")}${tab("expenses","💸","Gastos")}${tab("mechanic","🔧","Mecânica")}${tab("month","📊","Mês")}</nav></div>`}
function tab(v,i,t){return `<button class="tab ${view===v?"active":""}" onclick="go('${v}')"><b>${i}</b>${t}</button>`}
function go(v){view=v;render()}

function radioCard(){return `<div class="card radio-card"><div class="title" style="margin:0">📻 Rádio</div><div class="small">Ouça enquanto trabalha</div><div class="radio-grid" style="margin-top:10px"><div class="radio"><strong>Jovem Pan 94,1 FM</strong><span>Itajaí / Balneário Camboriú</span><a href="https://www.jovempanitajai.com.br/" target="_blank" rel="noopener">▶ Ouvir ao vivo</a></div><div class="radio"><strong>Transamérica 99,7 FM</strong><span>Balneário Camboriú</span><a href="https://www.trans99fm.com.br/" target="_blank" rel="noopener">▶ Ouvir ao vivo</a></div></div></div>`}

function renderDay(){let d=getDay(day),t=totals(d);let rows=d.entries.map(e=>`<div class="entry" data-id="${e.id}"><input data-f="comanda" type="number" inputmode="numeric" placeholder="Nº" value="${esc(e.comanda||"")}"><input data-f="taxa" type="number" inputmode="decimal" placeholder="Taxa" value="${esc(e.taxa||"")}"><input class="check" data-f="ok" type="checkbox" ${e.ok?"checked":""}><button class="trash" data-remove>×</button></div>`).join("");
return `<div class="daynav"><button class="navbtn" onclick="shiftDay(-1)">‹</button><div class="daycenter"><strong>${dateLabel(day)}</strong><input id="date" type="date" value="${day}"></div><button class="navbtn" onclick="shiftDay(1)">›</button></div>
<div class="card"><div class="title">Fechamento do dia</div><div class="kmgrid"><div><div class="small">KM inicial do dia</div><input id="kmi" type="number" inputmode="numeric" value="${esc(d.kmInicial)}" placeholder="Ex.: 45280"></div><div><div class="small">KM final do dia</div><input id="kmf" type="number" inputmode="numeric" value="${esc(d.kmFinal)}" placeholder="Ex.: 45397"></div></div><div class="kmresult"><span>Total rodado</span><b>${t.km} km</b></div></div>
<div class="card"><div class="row between"><div class="title">Comandas</div><span class="small">${t.conf}/${t.ent} conferidas</span></div><div class="tablehead"><span>Comanda</span><span>Taxa</span><span>OK</span><span></span></div>${rows||`<div class="empty">Nenhuma entrega lançada.<br>Toque em Nova comanda.</div>`}<button class="add" id="add">+ Nova comanda</button><div class="line"></div><div class="row between"><span>Arrancada do dia</span><div style="width:120px"><input id="arr" type="number" inputmode="decimal" value="${d.arrancada||0}"></div></div><div class="sum"><span>Entregas</span><b>${t.ent}</b></div><div class="sum"><span>Soma taxas</span><b>${brl(t.taxas)}</b></div><div class="sum"><span>Arrancada</span><b>${brl(t.arr)}</b></div><div class="sum total"><span>Total do dia</span><b>${brl(t.total)}</b></div></div>`+radioCard();
}
function bindDay(){let d=getDay(day);$("#date").onchange=e=>{day=e.target.value;render()};["kmi","kmf","arr"].forEach(id=>{$("#"+id).onchange=e=>{d=id==="kmi"?({...d,kmInicial:e.target.value}):id==="kmf"?({...d,kmFinal:e.target.value}):({...d,arrancada:e.target.value});saveDayAnd(day,d);render()}});$("#add").onclick=()=>{d.entries.push({id:crypto.randomUUID(),comanda:"",taxa:"",ok:false});saveDayAnd(day,d);render()};document.querySelectorAll(".entry").forEach(r=>{let id=r.dataset.id,e=d.entries.find(x=>x.id===id);r.querySelectorAll("input").forEach(i=>i.onchange=ev=>{let f=i.dataset.f;e[f]=f==="ok"?i.checked:i.value;saveDayAnd(day,d);render()});r.querySelector("[data-remove]").onclick=()=>{d.entries=d.entries.filter(x=>x.id!==id);saveDayAnd(day,d);render()}})}
function shiftDay(n){let [y,m,d]=day.split("-").map(Number),x=new Date(y,m-1,d+n);day=`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;render()}
function renderExpenses(){let d=getExp(expDay),rows=d.items.map(e=>`<div class="entry" data-id="${e.id}" style="grid-template-columns:1.1fr 1fr 1fr 30px"><select data-f="cat"><option ${e.cat==="combustivel"?"selected":""} value="combustivel">⛽ Combustível</option><option ${e.cat==="manutencao"?"selected":""} value="manutencao">🔧 Manutenção</option><option ${e.cat==="alimentacao"?"selected":""} value="alimentacao">🍔 Alimentação</option><option ${e.cat==="outros"?"selected":""} value="outros">📦 Outros</option></select><input data-f="desc" placeholder="Detalhe" value="${esc(e.desc||"")}"><input data-f="val" type="number" inputmode="decimal" placeholder="Valor" value="${esc(e.val||"")}"><button class="trash" data-remove>×</button></div>`).join("");let total=d.items.reduce((s,e)=>s+(+e.val||0),0);return `<div class="daynav"><button class="navbtn" onclick="shiftExp(-1)">‹</button><div class="daycenter"><strong>${dateLabel(expDay)}</strong><input id="expdate" type="date" value="${expDay}"></div><button class="navbtn" onclick="shiftExp(1)">›</button></div><div class="card"><div class="title">Gastos</div>${rows||'<div class="empty">Nenhum gasto lançado.</div>'}<button class="add" id="addexp">+ Novo gasto</button><div class="sum total"><span>Total do dia</span><b>${brl(total)}</b></div></div>`}
function bindExpenses(){let d=getExp(expDay);$("#expdate").onchange=e=>{expDay=e.target.value;render()};$("#addexp").onclick=()=>{d.items.push({id:crypto.randomUUID(),cat:"combustivel",desc:"",val:""});save("exp:"+expDay,d);render()};document.querySelectorAll(".entry").forEach(r=>{let id=r.dataset.id,e=d.items.find(x=>x.id===id);r.querySelectorAll("input,select").forEach(i=>i.onchange=()=>{e[i.dataset.f]=i.value;save("exp:"+expDay,d);render()});r.querySelector("[data-remove]").onclick=()=>{d.items=d.items.filter(x=>x.id!==id);save("exp:"+expDay,d);render()}})}
function shiftExp(n){let [y,m,d]=expDay.split("-").map(Number),x=new Date(y,m-1,d+n);expDay=`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;render()}
function renderMechanic(){let m=getMech(),d=getDay(day),km=+d.kmFinal||+m.motoKm||0,last=+m.ultimaTroca||0,int=+m.intervalo||0,next=last+int,rest=next?next-km:0,status=!next?"":rest<=0?"over":rest<=300?"att":"ok",label=status==="over"?"TROCA VENCIDA":status==="att"?"ATENÇÃO":"EM DIA";return `<div class="card mechhero"><div class="mechicon">🔧</div><div><div class="title" style="margin:0">Mecânica</div><div class="muted">Controle personalizado da sua moto</div></div></div><div class="card"><div class="title">🛢️ Troca de óleo</div><div class="kv"><span>KM da última troca</span><input id="last" style="width:130px" type="number" value="${esc(m.ultimaTroca)}"></div><div class="kv"><span>Intervalo definido por você</span><input id="int" style="width:130px" type="number" value="${esc(m.intervalo)}" placeholder="Ex.: 3000"></div><div class="kv"><span>Próxima troca</span><b class="bigblue">${next?next.toLocaleString("pt-BR")+" km":"—"}</b></div><div class="kv"><span>KM atual</span><b>${km?km.toLocaleString("pt-BR")+" km":"—"}</b></div><div class="kv"><span>Faltam</span><b class="${rest<=300?"yellow":"blue"}">${next?(rest>0?rest.toLocaleString("pt-BR")+" km":"0 km"):"—"}</b></div>${next?`<div style="margin-top:10px"><span class="status ${status}">${label}</span></div>`:""}<button class="primary" id="savemech">SALVAR CONFIGURAÇÃO</button></div><div class="notice">A KM final registrada no fechamento do dia é usada automaticamente como KM atual da mecânica.</div>`}
function bindMechanic(){$("#last").onchange=()=>{let m=getMech();m.ultimaTroca=$("#last").value;save("mechanica",m);render()};$("#int").onchange=()=>{let m=getMech();m.intervalo=$("#int").value;save("mechanica",m);render()};$("#savemech").onclick=()=>alert("Configuração salva automaticamente.")}
function monthKeys(){let p=`${month.getFullYear()}-${pad(month.getMonth()+1)}-`;let ks=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k?.startsWith(K+user+":day:")&&k.slice((K+user+":day:").length).startsWith(p))ks.push(k.slice((K+user+":day:").length))}return [...new Set(ks)].sort()}
function renderMonth(){let ks=monthKeys(),ds=ks.map(getDay),km=ds.reduce((s,d)=>s+totals(d).km,0),ent=ds.reduce((s,d)=>s+d.entries.length,0),tax=ds.reduce((s,d)=>s+totals(d).taxas,0),arr=ds.reduce((s,d)=>s+(+d.arrancada||0),0),exp=0;ks.forEach(k=>{exp+=getExp(k).items.reduce((s,e)=>s+(+e.val||0),0)});return `<div class="card"><div class="monthnav"><button class="navbtn" onclick="shiftMonth(-1)">‹</button><strong>${month.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</strong><button class="navbtn" onclick="shiftMonth(1)">›</button></div></div><div class="grid"><div class="stat"><div class="l">Entregas</div><div class="v blue">${ent}</div></div><div class="stat"><div class="l">KM rodados</div><div class="v blue">${km.toLocaleString("pt-BR")} km</div></div><div class="stat"><div class="l">Recebido</div><div class="v green">${brl(tax+arr)}</div></div><div class="stat"><div class="l">Gastos</div><div class="v red">${brl(exp)}</div></div></div><div class="card" style="margin-top:12px"><div class="sum"><span>KM inicial do mês</span><b>${ds.length?Math.min(...ds.map(d=>+d.kmInicial||Infinity)).toLocaleString("pt-BR"):"—"}</b></div><div class="sum"><span>KM final do mês</span><b>${ds.length?Math.max(...ds.map(d=>+d.kmFinal||0)).toLocaleString("pt-BR"):"—"}</b></div><div class="sum total"><span>Total rodado no mês</span><b class="blue">${km.toLocaleString("pt-BR")} km</b></div><div class="sum"><span>Média por dia lançado</span><b>${ds.length?Math.round(km/ds.length):0} km/dia</b></div></div><div class="card"><div class="title">Dias lançados</div>${ks.map(k=>{let t=totals(getDay(k));return `<div class="dayitem"><span>${dateLabel(k)}</span><span>${t.ent} entregas</span><b class="right blue">${t.km} km</b></div>`}).join("")||'<div class="empty">Nenhum dia lançado neste mês.</div>'}</div>`}
function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function backup(){let data={user,days:{},expenses:{},mechanica:getMech(),exportedAt:new Date().toISOString()};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);let pre=K+user+":";if(k?.startsWith(pre+"day:"))data.days[k.slice((pre+"day:").length)]=JSON.parse(localStorage.getItem(k));if(k?.startsWith(pre+"exp:"))data.expenses[k.slice((pre+"exp:").length)]=JSON.parse(localStorage.getItem(k))}let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=`delivery-backup-${today()}.json`;a.click()}
function logout(){localStorage.removeItem(K+"session");location.reload()}
function render(){if(!user)return showLogin();let c=view==="day"?renderDay():view==="expenses"?renderExpenses():view==="mechanic"?renderMechanic():renderMonth();shell(c);if(view==="day")bindDay();if(view==="expenses")bindExpenses();if(view==="mechanic")bindMechanic()}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
