name: Build Entrega365 APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.svg"
      - ".github/workflows/build-apk.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install

      - name: Preparar versão mobile
        run: npm run mobile:prepare

      - name: Verificar preparação mobile
        run: test -d www && echo "www OK - build remoto habilitado"

      - name: Preparar projeto Android
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          npx cap add android
          test -f /tmp/google-services.json || { echo "::error::Falta android/app/google-services.json no repositório."; exit 1; }
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configurar Firebase Google nativo
        run: |
          test -f android/app/google-services.json || { echo "::error::Falta android/app/google-services.json. Registre br.com.entrega365.app no Firebase e adicione o arquivo."; exit 1; }
          cat >> android/variables.gradle <<'EOF'

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          EOF

      - name: Restaurar chave DEBUG fixa
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: entrega365-debug-keystore-v2

      - name: Preparar chave DEBUG fixa
        run: |
          mkdir -p "$HOME/.config/.android" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Primeira execução: gerando chave DEBUG fixa para o projeto."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias AndroidDebugKey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Entrega365 Debug,O=Entrega365,C=BR"
          else
            echo "Chave DEBUG fixa restaurada do cache."
          fi
          cp "$HOME/.android/debug.keystore" "$HOME/.config/.android/entrega365-debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore"

      - name: Gerar SHA-1 DEBUG para Firebase
        working-directory: android
        run: |
          ./gradlew signingReport
          echo "=== SHA-1 DEBUG DO APK ==="
          keytool -list -v -keystore "$HOME/.config/.android/debug.keystore" -alias AndroidDebugKey -storepass android -keypass android | grep -E "Owner:|SHA1:|SHA-256:"
          echo "=========================="

      - name: Gerar ícones Entrega365
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#ffd21a" --iconBackgroundColorDark "#121212" --splashBackgroundColor "#121212" --splashBackgroundColorDark "#121212"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Entrega365-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
