<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-moto.svg">
<title>Delivery Comandas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#050b14;--panel:#0b1420;--line:#1b2a3b;--text:#f5f8fc;--muted:#91a0b4;--blue:#087cff;--blue2:#0057d9;--green:#19d67b;--yellow:#ffc21a;--red:#ff4b55}
body{margin:0;background:radial-gradient(circle at 20% -10%,#0c2c50 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
#app{min-height:100vh;padding-bottom:78px}
header{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(5,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:9px}.logo{width:46px;height:46px;border-radius:13px;background:#07111e url("logo-moto.svg") center/cover no-repeat;border:1px solid #164a80}.brand{font-weight:900;letter-spacing:.3px}.sub{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:5px}.ico,.navbtn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:11px;width:38px;height:38px}
main{max-width:650px;margin:auto;padding:14px 12px}.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(5,11,20,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab b{font-size:20px}.tab.active{color:#4da8ff}
.card{background:linear-gradient(145deg,#0d1926,#09121d);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 30px #0004}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border:1px solid var(--line);border-radius:15px;background:#0a141f}.stat .v{font-size:20px;font-weight:900;margin-top:6px}.stat .l{font-size:11px;color:var(--muted)}.blue{color:#48a7ff}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}
.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;padding:13px;margin-top:10px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.title{font-weight:900;font-size:17px;margin:3px 0 12px}.muted,.small{color:var(--muted)}.small{font-size:11px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.daycenter{text-align:center}.daycenter strong{display:block}.daycenter input{color:var(--muted);background:transparent;border:0;font-size:11px}
.tablehead,.entry{display:grid;grid-template-columns:1fr 1fr 38px 34px;gap:6px;align-items:center}.tablehead{color:var(--muted);font-size:10px;text-transform:uppercase;padding:0 2px 7px;border-bottom:1px solid var(--line)}.entry{padding:6px 0}
input,select{width:100%;background:#08121e;border:1px solid #223448;color:#fff;border-radius:10px;padding:10px 9px;outline:none}input:focus,select:focus{border-color:var(--blue)}.check{width:22px;height:22px;accent-color:var(--blue)}.trash{border:0;background:transparent;color:#ff6870;font-size:17px}.add{width:100%;padding:11px;border:1px dashed #285075;background:#081522;color:#49a8ff;border-radius:11px;font-weight:800}
.line{height:1px;background:var(--line);margin:13px 0}.sum{display:flex;justify-content:space-between;padding:5px 0;color:#b9c4d2}.sum.total{border-top:1px solid #3a4655;margin-top:5px;padding-top:11px;font-size:16px;font-weight:900;color:#fff}
.kmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kmresult{margin-top:9px;padding:13px;border:1px solid #155ba0;background:#06172a;border-radius:13px;display:flex;justify-content:space-between;align-items:center}.kmresult b{font-size:22px;color:#42a6ff}
.notice{padding:10px 12px;border-radius:11px;background:#0b1b2b;color:#aebdcd;font-size:12px;border:1px solid var(--line)}.notice.warn{border-color:#745b16;background:#211b08;color:#ffd65c}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 10%,#0b3157,transparent 38%),var(--bg)}.loginbox{width:100%;max-width:390px;text-align:center}.biglogo{width:190px;height:105px;margin:0 auto 10px;background:url("logo-moto.svg") center/contain no-repeat}.loginbox h1{margin:0;font-size:25px}.loginbox p{color:var(--muted);margin:5px 0 18px}.loginbox .card{text-align:left;padding:18px}.loginbox label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}
.mechhero{display:flex;gap:12px;align-items:center}.mechicon{font-size:30px}.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #17283a}.kv:last-child{border:0}.bigblue{font-size:24px;font-weight:900;color:#49a8ff}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:900;font-size:11px}.ok{background:#073a25;color:#42ef9c}.att{background:#3a2d05;color:#ffd43d}.over{background:#40131a;color:#ff6e77}
.monthnav{display:flex;justify-content:space-between;align-items:center}.monthnav strong{text-transform:capitalize}.dayitem{display:grid;grid-template-columns:1.2fr .9fr .9fr;gap:5px;padding:11px 0;border-bottom:1px solid var(--line)}.dayitem:last-child{border:0}.right{text-align:right}.empty{text-align:center;color:var(--muted);padding:25px 5px}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.grid{gap:7px}.stat{padding:11px}.stat .v{font-size:18px}.entry{grid-template-columns:1fr 1fr 34px 28px;gap:4px}.tablehead{grid-template-columns:1fr 1fr 34px 28px}.kmgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div><script src="auth-migrate.js"></script><script src="app.js"></script><script src="day-layout.js"></script></body>
</html>
