name: Build Entrega365 APK

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.svg"
      - ".github/workflows/build-apk.yml"
      - "android/**"
      - "android-widget/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install

      - name: Preparar versão mobile
        run: npm run mobile:prepare

      - name: Verificar preparação mobile
        run: test -d www && echo "www OK - build remoto habilitado"

      - name: Preparar projeto Android
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          rm -rf android
          npx cap add android
          node scripts/install-android-widget.mjs
          test -f /tmp/google-services.json || { echo "::error::Falta android/app/google-services.json no repositório."; exit 1; }
          cp /tmp/google-services.json android/app/google-services.json

      - name: Configurar Firebase Google nativo
        run: |
          test -f android/app/google-services.json || { echo "::error::Falta android/app/google-services.json. Registre br.com.entrega365.app no Firebase e adicione o arquivo."; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/google-services.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const client = data.client?.find(c => c.client_info?.android_client_info?.package_name === 'br.com.entrega365.app');
          if (!client) throw new Error('Cliente Android br.com.entrega365.app não encontrado no google-services.json');
          client.oauth_client = (client.oauth_client || []).filter(o =>
            o.client_id !== '686578751112-jimtsm0emdeq7b5eevm1gu1ao6tlqv8r.apps.googleusercontent.com'
          );
          const expectedId = '686578751112-dqo1uktduu5pjhkooki887luj8iev0f3.apps.googleusercontent.com';
          const expectedSha = '8c1a6644792519af2531ae8582de008930e3a06f';
          const exists = client.oauth_client.some(o => o.client_id === expectedId);
          if (!exists) {
            client.oauth_client.unshift({
              client_id: expectedId,
              client_type: 1,
              android_info: {
                package_name: 'br.com.entrega365.app',
                certificate_hash: expectedSha
              }
            });
          }
          const verified = client.oauth_client.some(o =>
            o.client_id === expectedId &&
            o.android_info?.package_name === 'br.com.entrega365.app' &&
            o.android_info?.certificate_hash?.toLowerCase() === expectedSha
          );
          if (!verified) throw new Error('Falha ao validar SHA-1 OAuth do APK #180.');
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\\n');
          console.log('OAuth Android validado: SHA-1 da execução #180.');
          NODE
          cat >> android/variables.gradle <<'EOF'

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          EOF

      - name: Restaurar chave DEBUG fixa
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: entrega365-debug-keystore-v2

      - name: Preparar chave DEBUG fixa
        run: |
          mkdir -p "$HOME/.config/.android" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Primeira execução: gerando chave DEBUG fixa para o projeto."
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android -keypass android               -alias AndroidDebugKey               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Entrega365 Debug,O=Entrega365,C=BR"
          else
            echo "Chave DEBUG fixa restaurada do cache."
          fi
          cp "$HOME/.android/debug.keystore" "$HOME/.config/.android/entrega365-debug.keystore"
          cp "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore"

      - name: Gerar SHA-1 DEBUG para Firebase
        working-directory: android
        run: |
          ./gradlew signingReport
          echo "=== SHA-1 DEBUG DO APK ==="
          keytool -list -v -keystore "$HOME/.config/.android/debug.keystore" -alias AndroidDebugKey -storepass android -keypass android | grep -E "Owner:|SHA1:|SHA-256:"
          echo "=========================="

      - name: Gerar ícones Entrega365
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#ffd21a" --iconBackgroundColorDark "#121212" --splashBackgroundColor "#121212" --splashBackgroundColorDark "#121212"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --warning-mode all

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Entrega365-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
