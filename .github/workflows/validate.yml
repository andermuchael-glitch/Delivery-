name: Validate Delivery PWA

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path(".tmp-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check .tmp-app.js
          rm -f .tmp-app.js
      - name: Validate service worker
        run: node --check sw.js