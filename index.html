<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<link rel="manifest" href="manifest.json?v=66">
<link rel="icon" href="logo-entrega365.jpg?v=66" type="image/jpeg">
<title>Entrega365</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#181818;--panel:#242424;--panel2:#2b2b2b;--line:#3a3a3a;--text:#f5f5f5;--muted:#a9a9a9;--accent:#ffd000;--accent2:#f2b900;--green:#55d98a;--red:#ff6b6b}
body{margin:0;background:radial-gradient(circle at 50% -10%,#343434 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
#app{min-height:100vh;padding-bottom:78px}
header{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(24,24,24,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:9px}.logo{width:46px;height:46px;border-radius:50%;background:#ffd000 url("logo-moto.svg") center/cover no-repeat;border:2px solid var(--accent)}.brand{font-weight:900;letter-spacing:.3px}.sub{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:5px}.ico,.navbtn{border:1px solid var(--line);background:#202020;color:#fff;border-radius:11px;width:38px;height:38px}
main{max-width:650px;margin:auto;padding:14px 12px}
.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(24,24,24,.98);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.tab{flex:1;border:0;background:transparent;color:#aaa;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab b{font-size:20px}.tab.active{color:var(--accent)}
.card{background:linear-gradient(145deg,#292929,#222);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 30px #0005}
.hero{display:flex;justify-content:space-between;align-items:center;padding:15px;border-radius:18px;background:linear-gradient(135deg,#303030,#202020);border:1px solid #4a4a4a;margin-bottom:13px}.hero h2{margin:0 0 4px;font-size:18px}.hero p{margin:0;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border:1px solid var(--line);border-radius:15px;background:#292929}.stat .v{font-size:20px;font-weight:900;margin-top:6px}.stat .l{font-size:11px;color:var(--muted)}.blue{color:#d8d8d8}.green{color:var(--green)}.yellow{color:var(--accent)}.red{color:var(--red)}
.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#151515;font-weight:900;padding:13px;margin-top:10px;box-shadow:0 7px 22px #ffd00033}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.title{font-weight:900;font-size:17px;margin:3px 0 12px}.muted{color:var(--muted)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.daycenter{text-align:center}.daycenter strong{display:block}.daycenter input{color:var(--muted);background:transparent;border:0;font-size:11px}
.tablehead,.entry{display:grid;grid-template-columns:1fr 1fr 38px 34px;gap:6px;align-items:center}.tablehead{color:var(--muted);font-size:10px;text-transform:uppercase;padding:0 2px 7px;border-bottom:1px solid var(--line)}.entry{padding:6px 0}
input,select{width:100%;background:#1f1f1f;border:1px solid #444;color:#fff;border-radius:10px;padding:10px 9px;outline:none}input:focus,select:focus{border-color:var(--accent)}
.check{width:22px;height:22px;accent-color:var(--accent)}.trash{border:0;background:transparent;color:#ff7777;font-size:17px}.add{width:100%;padding:11px;border:1px dashed #666;background:#202020;color:var(--accent);border-radius:11px;font-weight:800}
.line{height:1px;background:var(--line);margin:13px 0}.sum{display:flex;justify-content:space-between;padding:5px 0;color:#c8c8c8}.sum.total{border-top:1px solid #555;margin-top:5px;padding-top:11px;font-size:16px;font-weight:900;color:#fff}
.kmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kmresult{margin-top:9px;padding:13px;border:1px solid #555;background:#202020;border-radius:13px;display:flex;justify-content:space-between;align-items:center}.kmresult b{font-size:22px;color:var(--accent)}
.notice{padding:10px 12px;border-radius:11px;background:#292929;color:#c5c5c5;font-size:12px;border:1px solid var(--line)}.notice.warn{border-color:#826c12;background:#302a10;color:#ffe16a}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 10%,#383838,transparent 38%),var(--bg)}.loginbox{width:100%;max-width:390px;text-align:center}.biglogo{width:210px;height:210px;margin:0 auto 10px;background:url("logo-moto.svg") center/contain no-repeat;border-radius:50%}.loginbox h1{margin:0;font-size:25px}.loginbox p{color:var(--muted);margin:5px 0 18px}.loginbox .card{text-align:left;padding:18px}.loginbox label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}.loginbox .primary{margin-top:14px}
.mechhero{display:flex;gap:12px;align-items:center}.mechicon{font-size:30px}.oilbox{border:1px solid #555;background:#252525;border-radius:14px;padding:13px;margin-top:12px}.oilbox h3{margin:0 0 10px}.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #444}.kv:last-child{border:0}.bigblue{font-size:24px;font-weight:900;color:var(--accent)}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:900;font-size:11px}.ok{background:#123a25;color:#68e69a}.att{background:#3a300b;color:#ffd83d}.over{background:#401a1a;color:#ff7d7d}
.monthnav{display:flex;justify-content:space-between;align-items:center}.monthnav strong{text-transform:capitalize}.dayitem{display:grid;grid-template-columns:1.15fr .9fr 1fr;gap:5px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.dayitem:last-child{border:0}.right{text-align:right}.dayvalue{font-weight:900;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:25px 5px}.small{font-size:11px;color:var(--muted)}
@media(max-width:390px){main{padding-left:8px;padding-right:8px}.actions .ico:nth-child(1){display:none}.grid{gap:7px}.stat{padding:11px}.stat .v{font-size:18px}.entry{grid-template-columns:1fr 1fr 34px 28px;gap:4px}.tablehead{grid-template-columns:1fr 1fr 34px 28px}.kmgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const K="dcv2:",$=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0"), today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dateLabel=k=>{let [y,m,d]=k.split("-").map(Number),dt=new Date(y,m-1,d);return dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",weekday:"short"})};
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(K+user+":"+k))??f}catch{return f}};
const save=(k,v)=>localStorage.setItem(K+user+":"+k,JSON.stringify(v));
let user=localStorage.getItem(K+"session"), view="day", day=today(), expDay=today(), month=new Date(), loginMode="login";
const defDay=k=>({date:k,entries:[],arrancada:0,kmInicial:"",kmFinal:""});
const defExp=k=>({date:k,items:[]});
const defMech=()=>({ultimaTroca:"",intervalo:"",motoKm:""});
const getDay=k=>load("day:"+k,defDay(k)), getExp=k=>load("exp:"+k,defExp(k)), getMech=()=>load("mechanica",defMech());
function users(){return load("users",{})} function setUsers(v){save("users",v)}
function login(u,p){let us=users();return us[u]&&us[u].p===btoa(unescape(encodeURIComponent(p)))}
function showLogin(){document.body.innerHTML=`<div id="app"><div class="login"><div class="loginbox"><div class="biglogo"></div><h1>Entrega365</h1><p>${loginMode==="login"?"Controle suas entregas de forma simples":"Crie seu usuário neste aparelho"}</p><div class="card"><label>Usuário</label><input id="u" autocomplete="username"><label>Senha</label><input id="p" type="password" autocomplete="${loginMode==="login"?"current-password":"new-password"}"><button class="primary" id="go">${loginMode==="login"?"ENTRAR":"CRIAR CONTA"}</button><button class="add" id="switch" style="margin-top:9px">${loginMode==="login"?"Criar novo usuário":"Já tenho uma conta"}</button></div><div class="small">Dados locais por usuário neste dispositivo.</div></div></div></div>`;
$("#go").onclick=()=>{let u=$("#u").value.trim().toLowerCase(),p=$("#p").value;if(!u||!p)return alert("Preencha usuário e senha.");let us=users();if(loginMode==="register"){if(us[u])return alert("Usuário já existe.");us[u]={p:btoa(unescape(encodeURIComponent(p)))};setUsers(us)}else if(!login(u,p))return alert("Usuário ou senha inválidos.");user=u;localStorage.setItem(K+"session",u);location.reload()};$("#switch").onclick=()=>{loginMode=loginMode==="login"?"register":"login";showLogin()}}
function totals(d){let taxas=d.entries.reduce((s,e)=>s+(+e.taxa||0),0);let km=(+d.kmFinal||0)-(+d.kmInicial||0);return{taxas,ent:d.entries.length,conf:d.entries.filter(e=>e.ok).length,arr:+d.arrancada||0,total:taxas+(+d.arrancada||0),km:km>0?km:0}}
function saveDayAnd(k,d){save("day:"+k,d)}
function shell(content){document.body.innerHTML=`<div id="app"><header><div class="head"><div class="logo"></div><div><div class="brand">Entrega365</div><div class="sub">${esc(user)}</div></div></div><div class="actions"><button class="ico" onclick="backup()">⬇</button><button class="ico" onclick="logout()">⏻</button></div></header><main>${content}</main><nav class="tabs">${tab("day","📋","Dia")}${tab("expenses","💸","Gastos")}${tab("mechanic","🔧","Mecânica")}${tab("month","📊","Mês")}</nav></div>`}
function tab(v,i,t){return `<button class="tab ${view===v?"active":""}" onclick="go('${v}')"><b>${i}</b>${t}</button>`}
function go(v){view=v;render()}
function renderDay(){let d=getDay(day),t=totals(d);let rows=d.entries.map(e=>`<div class="entry" data-id="${e.id}"><input data-f="comanda" type="number" inputmode="numeric" placeholder="Nº" value="${esc(e.comanda||"")}"><input data-f="taxa" type="number" inputmode="decimal" placeholder="Taxa" value="${esc(e.taxa||"")}"><input class="check" data-f="ok" type="checkbox" ${e.ok?"checked":""}><button class="trash" data-remove>×</button></div>`).join("");
return `<div class="daynav"><button class="navbtn" onclick="shiftDay(-1)">‹</button><div class="daycenter"><strong>${dateLabel(day)}</strong><input id="date" type="date" value="${day}"></div><button class="navbtn" onclick="shiftDay(1)">›</button></div><div class="card"><div class="title">Fechamento do dia</div><div class="kmgrid"><div><div class="small">KM inicial do dia</div><input id="kmi" type="number" inputmode="numeric" value="${esc(d.kmInicial)}" placeholder="Ex.: 45280"></div><div><div class="small">KM final do dia</div><input id="kmf" type="number" inputmode="numeric" value="${esc(d.kmFinal)}" placeholder="Ex.: 45397"></div></div><div class="kmresult"><span>Total rodado</span><b>${t.km} km</b></div></div><div class="card"><div class="row between"><div class="title">Comandas</div><span class="small">${t.conf}/${t.ent} conferidas</span></div><div class="tablehead"><span>Comanda</span><span>Taxa</span><span>OK</span><span></span></div>${rows||`<div class="empty">Nenhuma entrega lançada.<br>Toque em Nova comanda.</div>`}<button class="add" id="add">+ Nova comanda</button><div class="line"></div><div class="row between"><span>Arrancada do dia</span><div style="width:120px"><input id="arr" type="number" inputmode="decimal" value="${d.arrancada||0}"></div></div><div class="sum"><span>Entregas</span><b>${t.ent}</b></div><div class="sum"><span>Soma taxas</span><b>${brl(t.taxas)}</b></div><div class="sum"><span>Arrancada</span><b>${brl(t.arr)}</b></div><div class="sum total"><span>Total do dia</span><b>${brl(t.total)}</b></div></div>`}
function bindDay(){let d=getDay(day);$("#date").onchange=e=>{day=e.target.value;render()};$("#kmi").oninput=e=>{d.kmInicial=e.target.value;saveDayAnd(day,d);renderDay()};$("#kmf").oninput=e=>{d.kmFinal=e.target.value;saveDayAnd(day,d);renderDay()};$("#arr").oninput=e=>{d.arrancada=e.target.value;saveDayAnd(day,d);renderDay()};$("#add").onclick=()=>{d.entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),comanda:"",taxa:"",ok:false});saveDayAnd(day,d);renderDay()};document.querySelectorAll(".entry").forEach(row=>{let id=row.dataset.id;row.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{let e=d.entries.find(x=>x.id===id);e[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;saveDayAnd(day,d);renderDay()});row.querySelector("[data-remove]").onclick=()=>{d.entries=d.entries.filter(x=>x.id!==id);saveDayAnd(day,d);renderDay()}})}
function shiftDay(n){let d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);day=todayKey(d);render()}
function todayKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function render(){if(!user)return showLogin();if(view==="day")shell(renderDay());else if(view==="expenses")shell(renderExpenses());else if(view==="mechanic")shell(renderMechanic());else shell(renderMonth());if(view==="day")bindDay();else if(view==="expenses")bindExpenses();else if(view==="mechanic")bindMechanic();else bindMonth()}
function renderExpenses(){let d=getExp(expDay);let rows=d.items.map((e,i)=>`<div class="entry" data-i="${i}"><input data-f="desc" placeholder="Descrição" value="${esc(e.desc||"")}"><input data-f="valor" type="number" inputmode="decimal" placeholder="Valor" value="${esc(e.valor||"")}"><button class="trash" data-remove>×</button></div>`).join("");let total=d.items.reduce((s,e)=>s+(+e.valor||0),0);return `<div class="daynav"><button class="navbtn" onclick="shiftExp(-1)">‹</button><div class="daycenter"><strong>Gastos</strong><input id="expdate" type="date" value="${expDay}"></div><button class="navbtn" onclick="shiftExp(1)">›</button></div><div class="card"><div class="title">Lançamentos</div>${rows||`<div class="empty">Nenhum gasto lançado.</div>`}<button class="add" id="addexp">+ Novo gasto</button><div class="line"></div><div class="sum total"><span>Total</span><b>${brl(total)}</b></div></div>`}
function bindExpenses(){let d=getExp(expDay);$("#expdate").onchange=e=>{expDay=e.target.value;render()};$("#addexp").onclick=()=>{d.items.push({desc:"",valor:""});save("exp:"+expDay,d);render()};document.querySelectorAll(".entry").forEach(row=>{let i=+row.dataset.i;row.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{d.items[i][el.dataset.f]=el.value;save("exp:"+expDay,d);renderExpenses()});row.querySelector("[data-remove]").onclick=()=>{d.items.splice(i,1);save("exp:"+expDay,d);renderExpenses()}})}
function shiftExp(n){let d=new Date(expDay+"T12:00:00");d.setDate(d.getDate()+n);expDay=todayKey(d);render()}
function renderMechanic(){let m=getMech();let last=m.ultimaTroca?new Date(m.ultimaTroca+"T12:00:00"):null;let due=last&&m.intervalo?new Date(last.getTime()+Number(m.intervalo)*86400000):null;let st=!due?"Sem data definida":(new Date()>due?"Troca vencida":"Em dia");return `<div class="card mechhero"><div class="mechicon">🔧</div><div><div class="title">Mecânica</div><div class="muted">Controle da troca de óleo</div></div></div><div class="card"><div class="title">Troca de óleo</div><label class="small">Data da última troca</label><input id="oildate" type="date" value="${esc(m.ultimaTroca)}"><label class="small">Intervalo (dias)</label><input id="oilint" type="number" inputmode="numeric" value="${esc(m.intervalo)}" placeholder="Ex.: 180"><label class="small">KM atual da moto</label><input id="mkm" type="number" inputmode="numeric" value="${esc(m.motoKm)}" placeholder="Ex.: 45280"><div class="oilbox"><div class="kv"><span>Status</span><b>${st}</b></div><div class="kv"><span>Próxima troca</span><b>${due?due.toLocaleDateString("pt-BR"):"—"}</b></div></div></div>`}
function bindMechanic(){let m=getMech();["oildate","oilint","mkm"].forEach((id,i)=>$("#"+id).oninput=e=>{let k=["ultimaTroca","intervalo","motoKm"][i];m[k]=e.target.value;save("mechanica",m);renderMechanic()})}
function renderMonth(){let y=month.getFullYear(),m=month.getMonth();let days=[];for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=`${y}-${pad(m+1)}-${pad(d)}`,x=getDay(k),t=totals(x);if(t.ent||t.arr||t.km)days.push(`<div class="dayitem"><div><b>${dateLabel(k)}</b></div><div>${t.ent} entregas</div><div class="right"><b>${brl(t.total)}</b></div></div>`)}return `<div class="monthnav"><button class="navbtn" onclick="shiftMonth(-1)">‹</button><strong>${month.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</strong><button class="navbtn" onclick="shiftMonth(1)">›</button></div><div class="card" style="margin-top:12px">${days.join("")||`<div class="empty">Nenhum lançamento neste mês.</div>`}</div>`}
function bindMonth(){}
function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function logout(){localStorage.removeItem(K+"session");user=null;showLogin()}
function backup(){let data={user,days:{},expenses:{},mechanica:getMech()};for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);let k=todayKey(d),x=localStorage.getItem(K+user+":day:"+k),e=localStorage.getItem(K+user+":exp:"+k);if(x)data.days[k]=JSON.parse(x);if(e)data.expenses[k]=JSON.parse(e)}let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`entrega365-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
render();
</script>
</body>
</html>
