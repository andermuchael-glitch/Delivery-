<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-moto.svg">
<title>Entrega365 - Controle de Entregas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#121212;
  --panel:#1e1e1e;
  --panel2:#262626;
  --line:#333333;
  --line-focus:#ffd000;
  --text:#f5f5f5;
  --muted:#a0a0a0;
  --accent:#ffd000;
  --accent2:#e6b800;
  --green:#4cd964;
  --red:#ff453a;
  --radius:16px;
  --font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
  margin:0;
  background:radial-gradient(circle at 50% -20%,#2c2c2c 0,transparent 45%),var(--bg);
  color:var(--text);
  font:14px/1.5 var(--font-family);
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{cursor:pointer;border:0;background:none;transition:all .15s ease}
button:active{transform:scale(.98)}

#app{min-height:100vh;padding-bottom:86px}

/* HEADER */
header{
  height:64px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  background:rgba(18,18,18,.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.head{display:flex;align-items:center;gap:10px}
.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ffd000 url("logo-moto.svg") center/cover no-repeat;
  border:2px solid var(--accent);
  box-shadow:0 0 12px rgba(255,208,0,.25);
}
.brand{font-weight:900;letter-spacing:.4px;font-size:16px;color:#fff}
.sub{font-size:11px;color:var(--accent);font-weight:600}
.actions{display:flex;gap:8px}
.ico{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:12px;
  width:40px;
  height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}
.ico:hover{border-color:var(--accent);color:var(--accent)}

/* MAIN CONTAINER */
main{max-width:600px;margin:auto;padding:16px 12px}

/* TABS BOTTOM NAV */
.tabs{
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  background:rgba(22,22,22,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.tab{
  flex:1;
  border:0;
  background:transparent;
  color:#8e8e93;
  font-size:11px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.tab b{font-size:20px;line-height:1}
.tab.active{color:var(--accent)}

/* CARDS */
.card{
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
